services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    ports:
      # 5433 наружу (системный PostgreSQL может занимать 5432), внутри сети — 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      FSP_DATABASE_URL: postgresql+asyncpg://fsp:fsp@db:5432/fsp
      FSP_MAIL_BACKEND: log
      FSP_CONFIRM_BASE_URL: http://localhost:5173/confirm-email
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata: